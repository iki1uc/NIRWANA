<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIRWANA · DISpatcher · index</title>

<style>
    body {
        background:#0a0a12;
        color:#d0d9e6;
        font-family:Consolas, monospace;
        padding:20px;
    }
    h1 {
        text-align:center;
        letter-spacing:4px;
        margin-bottom:20px;
        background:linear-gradient(90deg,#ffd700,#00ccff,#ff66ff,#00ff88);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }
    .panel {
        background:rgba(255,255,255,0.05);
        padding:16px;
        border-radius:12px;
        margin-bottom:20px;
        border:1px solid rgba(0,200,255,0.08);
    }
    .flex { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    label { font-size:11px; color:#9df; }
    input {
        background:#000; color:#0f0; border:1px solid #0f0;
        padding:4px 8px; width:70px;
    }
    button {
        background:#0f0; color:#000; border:none;
        padding:6px 14px; font-weight:bold; cursor:pointer;
    }
    button:hover { background:#0ff; }
    pre {
        background:rgba(0,0,0,0.3);
        padding:16px;
        border-radius:12px;
        border:1px solid rgba(0,200,255,0.05);
        overflow-x:auto;
        font-size:13px;
        white-space:pre-wrap;
    }
    .ok { color:#6bffa9; }
    .err { color:#ff6b8a; }
</style>
</head>
<body>

<h1>NIRWANA · DISpatcher</h1>

<div class="panel">
<pre>
ID.MODE     = neutral
ID.CORE     = 243
ID.ROLE     = PQ‑Root
ID.STATE    = verbunden
ID.RUNTIME  = RIR.Core + DQF + XyX + 243
ID.WHIRL    = WHIRL_PQ
</pre>
</div>

<div class="panel">
    <div class="flex">
        <label>X:</label><input id="x" type="number" value="3">
        <label>Y:</label><input id="y" type="number" value="9">
        <label>Z:</label><input id="z" type="number" value="27">
        <button id="runBtn">▶ RUN</button>
    </div>
</div>

<div id="output"></div>

<script type="module">
import { baseDQF } from "./3.js";
import { extendedDQF } from "./81.js";
import { XyX } from "./XyX.js";
import { stateProxy } from "./243.js";
import { RIR } from "./RIR.Core.js";

const outputEl = document.getElementById("output");

function panel(title, value, error=false) {
    const div = document.createElement("div");
    div.className = "panel";
    div.innerHTML = `
        <h3 style="margin:0 0 8px 0;font-size:13px;color:${error ? '#ff6b8a' : '#00ccff'}">${title}</h3>
        <pre class="${error ? 'err' : 'ok'}">${value}</pre>
    `;
    outputEl.appendChild(div);
}

function run() {
    outputEl.innerHTML = "";

    const x = Number(x.value);
    const y = Number(y.value);
    const z = Number(z.value);

    // RIR.Core
    try {
        panel("RIR.Core", JSON.stringify(RIR.return({x,y,z}), null, 2));
    } catch(e) {
        panel("❌ RIR ERROR", e.stack, true);
    }

    // baseDQF
    try {
        panel("baseDQF (3.js)", JSON.stringify(baseDQF(x,y,z), null, 2));
    } catch(e) {
        panel("❌ baseDQF ERROR", e.stack, true);
    }

    // extendedDQF
    try {
        panel("extendedDQF (81.js)", JSON.stringify(extendedDQF(x,y,z), null, 2));
    } catch(e) {
        panel("❌ extendedDQF ERROR", e.stack, true);
    }

    // XyX
    try {
        const xyx = XyX(x,y,z);
        panel("XyX (AIR/AIV)", JSON.stringify(xyx, null, 2));
    } catch(e) {
        panel("❌ XyX ERROR", e.stack, true);
    }

    // 243 Proxy
    try {
        const state = stateProxy[`${x},${y},${z}`];
        panel("stateProxy (243.js)", JSON.stringify(state, null, 2));
    } catch(e) {
        panel("❌ stateProxy ERROR", e.stack, true);
    }
}
function updateNEWEDA_LIVE() {
    if (!window.RITH_ENGINE || !RITH_ENGINE.tmp.detail) return;

    const rith = RITH_ENGINE.rith;
    const d = RITH_ENGINE.tmp.detail;
    const state = NEWEDA_STATE_MACHINE(rith);

    document.getElementById("lm-neweda-state").innerText =
        "STATE: " + state;

    document.getElementById("lm-neweda-rith").innerText =
        "RITH: " + rith;

    document.getElementById("lm-neweda-norm").innerText =
        "8→9‑Norm: " + (d.vector ? "aktiv" : "inaktiv");

    document.getElementById("lm-neweda-raw").innerText =
        "RAW: " + (d.raw ? "✔" : "✘");

    document.getElementById("lm-neweda-structure").innerText =
        "STRUCTURE: " + (d.structure ? "✔" : "✘");

    document.getElementById("lm-neweda-vector").innerText =
        "VECTOR: " + (d.vector ? "✔" : "✘");

    document.getElementById("lm-neweda-fusion").innerText =
        "FUSION: " + (d.fusion ? "✔" : "✘");
}

document.getElementById("runBtn").addEventListener("click", run);
run();
</script>

</body>
</html>
